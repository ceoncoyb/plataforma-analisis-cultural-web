name: Pages public health
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-pages:
    if: github.repository == 'ceoncoyb/plataforma-analisis-cultural-web'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public paths and anonymous API security
        run: node scripts/monitor-pages.mjs
  report-regression:
    needs: check-pages
    if: always() && needs.check-pages.result == 'failure' && github.repository == 'ceoncoyb/plataforma-analisis-cultural-web'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Create at most one open incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title='Pages public health regression (automated)'
          existing="$(gh issue list --state open --limit 100 --json title --jq '.[] | .title' | grep -Fx "$title" || true)"
          if [[ -z "$existing" ]]; then
            gh issue create --title "$title" --body "A scheduled read-only Pages health check failed. Review the run: $GH_RUN_URL. No user data or billable AI POST requests were sent. Access/D1 HTTP 503 is a known separate blocker and does not cause this issue alone."
          fi
