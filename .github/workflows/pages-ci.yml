name: Pages tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and run regression tests
        run: npm test

      - name: Upload non-sensitive pilot static preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-chat-static-preview
          path: |
            dist/conversacion/
            dist/assets/site.css
            dist/assets/site.js
            dist/assets/brand-mark.svg
          retention-days: 1
          if-no-files-found: error
